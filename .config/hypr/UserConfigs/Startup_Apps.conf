# Shanmukha Kumar Karra — minimal autostart

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = sh -c 'swww-daemon --format xrgb 2>/dev/null || true'
exec-once = env HYPRMASTER_RELOAD_UI=0 bash $UserScripts/skkarra-theme-switch.sh apply liquid-glass-dark
exec-once = bash $scriptsDir/Polkit.sh
exec-once = nm-applet --indicator
exec-once = waybar
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = $HOME/.config/hypr/initial-boot.sh
