# Shanmukha Kumar Karra — default theme decoration (liquid-glass-dark)

general {
    col.active_border = rgba(ffffff55) rgba(ffffff22) 45deg
    col.inactive_border = rgba(ffffff18)
}

decoration {
    rounding = 18
    active_opacity = 0.88
    inactive_opacity = 0.78
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 16
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        special = true
        popups = true
    }

    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = $shadow_color
        color_inactive = $shadow_color_inactive
    }

    dim_inactive = true
    dim_strength = 0.12
}
