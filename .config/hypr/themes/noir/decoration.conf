# Shanmukha Kumar Karra — noir decoration

general {
    col.active_border = $color12 $color15 45deg
    col.inactive_border = rgba(ffffff11)
}

decoration {
    rounding = 12
    active_opacity = 0.85
    inactive_opacity = 0.75
    blur {
        enabled = true
        size = 12
        passes = 4
    }
}
