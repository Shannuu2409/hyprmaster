# Shanmukha Kumar Karra — liquid glass dark

general {
    col.active_border = rgba(ffffff55) rgba(ffffff22) 45deg
    col.inactive_border = rgba(ffffff18)
}

decoration {
    rounding = 18
    active_opacity = 0.88
    inactive_opacity = 0.78

    blur {
        enabled = true
        size = 16
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02
        contrast = 0.9
        brightness = 0.5
        vibrancy = 0.08
        special = true
        popups = true
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgba(00000066)
        color_inactive = rgba(00000044)
    }

    dim_inactive = true
    dim_strength = 0.12
}
